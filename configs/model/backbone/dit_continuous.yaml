_target_: src.backbone.dit_continuous.ContinuousDIT
length: ${model.config.length}
causal_attention: false
adaln: true
hidden_size: -1
cond_dim: 128
n_heads: -1
num_layers: -1
dropout: 0.1
tie_word_embeddings: true
attn_backend: sdpa
vocab_size: -1
block_size: ${block_size}
pretrained_model_name_or_path: ${pretrained_model_name_or_path}
# Initialize vocab_embed/output_layer from a pretrained model's token
# embedding table (e.g. "t5-small") instead of random init, and freeze them.
# hidden_size must exactly match that model's embedding dim (512 for t5-small).
pretrained_embedding_model: null
freeze_pretrained_embeddings: true
